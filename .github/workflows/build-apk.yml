name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug || true

          sed -i '/android\.builtInKotlin/d; /android\.newDsl/d' android/gradle.properties 2>/dev/null || true

          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.aagaazinstitute.aagaaz_institute"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.aagaazinstitute.aagaaz_institute"
                  minSdk = 21
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          SDK_PATH="${FLUTTER_ROOT:-$(dirname $(dirname $(which flutter)))}"
          cd android
          ./gradlew assembleDebug -Pflutter.sdk="$SDK_PATH" --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aagaaz-institute-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
