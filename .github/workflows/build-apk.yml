name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (fix after Flutter auto-upgrade if needed)
        run: |
          if ! flutter build apk --debug; then
            echo "Fixing minSdk after Flutter upgrade..."
            sed -i 's/minSdkVersion.*/minSdk = 21/g' android/app/build.gradle.kts
            grep -n "minSdk" android/app/build.gradle.kts
            flutter build apk --debug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aagaaz-institute-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
